name = "questor"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"

[vars]
# Default model for every session — the UI no longer offers a choice.
# Provider is inferred from the model name itself (see src/models/index.ts) —
# no separate provider setting. Swap providers/models by changing this value;
# a session can still override it by passing its own model_name to POST
# /session (see src/index.ts), the mechanism this default sits on top of.
MODEL_NAME = "claude-sonnet-4-6"
