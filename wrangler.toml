name = "questor"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"

[vars]
# Fallback default when a session doesn't choose its own model_name.
# Provider is inferred from the model name itself (see src/models/index.ts) —
# no separate provider setting.
MODEL_NAME = "@cf/openai/gpt-oss-20b"
