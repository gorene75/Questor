<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Questor</title>
<style>
  body { font-family: monospace; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #messages { border: 1px solid #999; padding: 0.75rem; height: 60vh; overflow-y: auto; margin-bottom: 0.75rem; white-space: pre-wrap; }
  .msg { margin-bottom: 0.75rem; }
  .msg.player { color: #444; }
  .msg.player::before { content: "> "; }
  .msg.narrator::before { content: ""; }
  .msg.refused { background: #fff3cd; }
  .msg.refused::after { content: "  [refused: true]"; color: #a66; font-weight: bold; }
  .msg.ending { font-weight: bold; }
  form { display: flex; gap: 0.5rem; }
  input[type="text"] { flex: 1; font-family: monospace; padding: 0.4rem; }
  button { font-family: monospace; padding: 0.4rem 0.8rem; }
  #setup { border: 1px solid #999; padding: 0.75rem; margin-bottom: 0.75rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  #setup label { white-space: nowrap; }
  #setup select { font-family: monospace; padding: 0.3rem; flex: 1; min-width: 12rem; }
  #model-tag { color: #666; font-size: 0.85em; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h3>Questor</h3>

<div id="setup">
  <label for="model-select">Model:</label>
  <select id="model-select">
    <option value="">(server default)</option>
    <optgroup label="Workers AI">
      <option value="@cf/openai/gpt-oss-20b">gpt-oss-20b</option>
      <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">llama-3.3-70b-instruct-fp8-fast</option>
      <option value="@cf/meta/llama-4-scout-17b-16e-instruct">llama-4-scout-17b-16e-instruct</option>
    </optgroup>
    <optgroup label="Anthropic">
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (cheap, fast)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5</option>
    </optgroup>
  </select>
  <button id="start-button" type="button">Start</button>
</div>

<div id="model-tag"></div>
<div id="messages"></div>
<form id="input-form">
  <input id="player-input" type="text" autocomplete="off" placeholder="What do you do?" disabled />
  <button type="submit">Send</button>
</form>

<script>
const QUEST_ID = "speckled-band";
let sessionId = null;
let ended = false;

const setupEl = document.getElementById("setup");
const modelSelectEl = document.getElementById("model-select");
const startButtonEl = document.getElementById("start-button");
const modelTagEl = document.getElementById("model-tag");
const messagesEl = document.getElementById("messages");
const formEl = document.getElementById("input-form");
const inputEl = document.getElementById("player-input");

function addMessage(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function start() {
  startButtonEl.disabled = true;
  const chosenModel = modelSelectEl.value;

  const res = await fetch("/session", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ quest_id: QUEST_ID, model_name: chosenModel || undefined }),
  });
  const data = await res.json();
  if (!res.ok) {
    addMessage("Failed to start session: " + (data.error || res.status), "narrator");
    startButtonEl.disabled = false;
    return;
  }

  sessionId = data.session_id;
  modelTagEl.textContent = "model: " + (chosenModel || "(server default)");
  setupEl.style.display = "none";

  addMessage(data.narration, "narrator");
  inputEl.disabled = false;
  inputEl.focus();
}

startButtonEl.addEventListener("click", start);

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || !sessionId || ended) return;

  addMessage(text, "player");
  inputEl.value = "";
  inputEl.disabled = true;

  const res = await fetch("/turn", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, input: text }),
  });
  const data = await res.json();

  if (!res.ok) {
    addMessage("Error: " + (data.error || res.status), "narrator");
    inputEl.disabled = false;
    return;
  }

  const kinds = ["narrator"];
  if (data.refused) kinds.push("refused");
  addMessage(data.narration, kinds.join(" "));

  if (data.status !== "active") {
    ended = true;
    const title = data.ending ? data.ending.title : data.status;
    addMessage("--- " + title + " (" + data.status + ") ---", "ending");
  } else {
    inputEl.disabled = false;
    inputEl.focus();
  }
});
</script>
</body>
</html>
